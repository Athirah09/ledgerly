<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Ledgerly</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Caveat:wght@500;700&family=Figtree:wght@400..800&display=swap">
<style>
/* Layout: a phone-shaped app in the middle. Wide screens add brand copy on the left and a live Excel sheet on the right. */
:root{
  --bg:#E9F2EC; --bg-wash:#F5EEDF;
  --surface:#FFFFFF; --surface-2:#F1F7F3; --app:#F6FAF7;
  --ink:#10261C; --ink-2:#44594E; --ink-3:#62766B;
  --line:#DDE8E0; --line-2:#C9D8CE;
  --brand:#0E6B47; --brand-ink:#0A4A32; --brand-soft:#DCF0E3; --on-brand:#FFFFFF;
  --gold:#E9AE2F; --track:#E4EEE7;
  --good:#0B7A3B; --good-soft:#DDF1E3;
  --warn:#8A5700; --warn-soft:#FBEFD3; --warn-bar:#E0A100;
  --bad:#B72F2F; --bad-soft:#FBE1E0; --bad-bar:#D04545;
  --focus:#1B7FD8; --device:#15271E; --xl-bar:#1D6F42;
  --c-food:#eb6834; --c-transport:#2a78d6; --c-housing:#1baf7a; --c-groceries:#eda100;
  --c-study:#6250d6; --c-fun:#e87ba4; --c-other:#8a9a91;
  --leaf:#3FA66F; --leaf-2:#2C8657; --bean:#CFE9B8; --bean-ink:#1D3B2A; --blush:#F29B8E;
  --font-display:'Bricolage Grotesque',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Figtree','Avenir Next',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-hand:'Caveat','Segoe Print','Bradley Hand',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1612; --bg-wash:#16231B; --surface:#16211B; --surface-2:#1D2A23; --app:#121C17;
  --ink:#E7F1EA; --ink-2:#B1C4B8; --ink-3:#8FA498; --line:#25352C; --line-2:#33463B;
  --brand:#3DB382; --brand-ink:#8EE0B8; --brand-soft:#173A2B; --on-brand:#06251A;
  --gold:#F0B94A; --track:#22322A; --good:#5ED392; --good-soft:#173A2B;
  --warn:#F2BE55; --warn-soft:#3A2D10; --bad:#FF8C88; --bad-soft:#40201F;
  --device:#2B3D34;
  --c-food:#d95926; --c-transport:#3987e5; --c-housing:#199e70; --c-groceries:#c98500;
  --c-study:#9085e9; --c-fun:#d55181; --c-other:#8fa398;
  --leaf:#4CBF82; --leaf-2:#379A68; --bean:#9FCB86; --blush:#E9877A;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1612; --bg-wash:#16231B; --surface:#16211B; --surface-2:#1D2A23; --app:#121C17;
  --ink:#E7F1EA; --ink-2:#B1C4B8; --ink-3:#8FA498; --line:#25352C; --line-2:#33463B;
  --brand:#3DB382; --brand-ink:#8EE0B8; --brand-soft:#173A2B; --on-brand:#06251A;
  --gold:#F0B94A; --track:#22322A; --good:#5ED392; --good-soft:#173A2B;
  --warn:#F2BE55; --warn-soft:#3A2D10; --bad:#FF8C88; --bad-soft:#40201F;
  --device:#2B3D34;
  --c-food:#d95926; --c-transport:#3987e5; --c-housing:#199e70; --c-groceries:#c98500;
  --c-study:#9085e9; --c-fun:#d55181; --c-other:#8fa398;
  --leaf:#4CBF82; --leaf-2:#379A68; --bean:#9FCB86; --blush:#E9877A;
  color-scheme:dark}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-color:var(--bg);
  background-image:radial-gradient(900px 520px at 6% -8%,var(--bg-wash),transparent 70%),radial-gradient(800px 500px at 100% 112%,var(--bg-wash),transparent 70%);
  color:var(--ink);font:400 14px/1.45 var(--font-body);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button:disabled{cursor:default;opacity:.55}
h1,h2,h3,p,ul{margin:0}
ul{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:8px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:20px;height:20px;flex:none}
.num,.tab-nums{font-variant-numeric:tabular-nums}

/* ---------- stage ---------- */
.stage{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr);justify-items:center;align-items:center;gap:28px}
.brand-col,.side{display:none}
.phone{position:relative;display:flex;flex-direction:column;width:100%;max-width:440px;height:100%;max-height:860px;min-width:0;
  background:var(--app);border:1px solid var(--line);border-radius:28px;overflow:hidden}
.statusbar{display:none}
.screen{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:6px 16px 22px;scrollbar-width:thin;outline:0}
.nav{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;padding:6px 8px 8px;background:var(--surface);border-top:1px solid var(--line)}
.nav[hidden]{display:none}
.nav button{display:grid;justify-items:center;gap:2px;padding:6px 0;border-radius:12px;color:var(--ink-3);font-size:11px;font-weight:600}
.nav button[aria-current="page"]{color:var(--brand);background:var(--brand-soft)}
.layer{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;z-index:20}
.layer[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(8,20,14,.5)}
.sheet{position:relative;max-height:88%;overflow-y:auto;overscroll-behavior:contain;background:var(--surface);border-radius:24px 24px 0 0;padding:16px 16px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px;outline:0}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sheet-h h2{font:700 19px/1.2 var(--font-display)}
.toast{position:absolute;left:16px;right:16px;bottom:84px;z-index:30;padding:11px 14px;border-radius:14px;background:var(--ink);color:var(--surface);font-weight:600;font-size:13px;text-align:center;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
.toast.on{opacity:1;transform:none}
.toast[data-k="bad"]{background:var(--bad);color:#fff}

@media (min-width:700px){
  .stage{grid-template-columns:auto minmax(0,520px);justify-content:center}
  .phone{width:392px;height:min(100%,820px);border:9px solid var(--device);border-radius:46px;box-shadow:0 24px 60px -24px rgba(8,30,20,.45)}
  .statusbar{display:flex;align-items:center;justify-content:space-between;padding:10px 22px 2px;font:700 12px var(--font-body);color:var(--ink)}
  .sb{display:flex;gap:5px;align-items:center}
  .sb svg{width:16px;height:12px}
  .side{display:flex}
  .only-narrow{display:none!important}
  .toast{bottom:80px}
}
@media (min-width:1100px){
  .stage{grid-template-columns:minmax(250px,320px) auto minmax(0,520px)}
  .brand-col{display:flex}
}
.brand-col,.side{flex-direction:column;gap:16px;min-width:0;max-height:100%;overflow-y:auto;align-self:center;width:100%;padding:4px}

/* ---------- brand column ---------- */
.wordmark{display:inline-flex;align-items:flex-end;gap:2px;font:800 44px/1 var(--font-display);letter-spacing:-.03em;color:var(--brand-ink)}
.wordmark svg{width:30px;height:30px;color:var(--leaf);margin-bottom:26px;margin-right:-8px}
.tag{font:700 24px/1.15 var(--font-display);text-wrap:balance}
.lead{color:var(--ink-2);max-width:34ch}
.feat{display:grid;gap:8px}
.feat button{display:flex;gap:12px;align-items:center;width:100%;padding:10px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.feat button:hover{border-color:var(--brand)}
.feat .fi{width:40px;height:40px;border-radius:12px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.feat b{display:block;font-weight:700}
.feat small{color:var(--ink-3);font-size:12px}
.note-hand{display:flex;align-items:center;gap:8px;font:700 24px/1 var(--font-hand);color:var(--brand-ink)}
.note-hand svg{width:76px;height:76px;flex:none}

/* ---------- headers and type ---------- */
.top{display:flex;align-items:center;gap:6px;min-height:48px;padding-top:4px}
.top h1{font:700 21px/1.2 var(--font-display);flex:1;min-width:0}
.top-r{display:flex;gap:4px}
.icon-btn{width:44px;height:44px;border-radius:12px;display:inline-grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--surface-2)}
.lab{font-size:12px;font-weight:600;color:var(--ink-2)}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
.sec-h h2{font:700 16px/1.2 var(--font-display)}
.link{color:var(--brand);font-weight:700;font-size:13px;padding:10px 6px;min-height:40px}
.hint{font-size:12px;color:var(--ink-3)}
.err{font-size:13px;font-weight:600;color:var(--bad);background:var(--bad-soft);padding:8px 12px;border-radius:10px}
.err[hidden]{display:none}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px}
.card h2{font:700 15px/1.2 var(--font-display);margin-bottom:10px}
.big{font:700 32px/1.05 var(--font-display);letter-spacing:-.02em}
.big .cur,.cur{font-size:.55em;font-weight:600;color:var(--ink-2);margin-right:3px;letter-spacing:0}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:12px;font-weight:700}
.pill .ic{width:14px;height:14px}
.pill[data-s="ok"]{background:var(--good-soft);color:var(--good)}
.pill[data-s="near"]{background:var(--warn-soft);color:var(--warn)}
.pill[data-s="over"]{background:var(--bad-soft);color:var(--bad)}
.sample{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:12.5px;font-weight:600;margin-top:6px}
.sample span{flex:1}

/* ---------- home ---------- */
.hello{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 2px 10px}
.hello .hi{color:var(--ink-2);font-weight:600}
.hello .nm{display:flex;align-items:center;gap:8px;font:800 30px/1.1 var(--font-display);letter-spacing:-.02em}
.hello .nm .ic{color:var(--gold);width:24px;height:24px}
.hello .sub{color:var(--ink-3);font-size:13px}
.hello svg.mas{width:84px;height:84px;flex:none}
.bal-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 2px}
.delta{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:13px}
.delta .ic{width:16px;height:16px}
.delta.up{color:var(--good)} .delta.down{color:var(--bad)}
.alert{display:flex;gap:10px;align-items:center;width:100%;padding:10px 12px;border-radius:14px;font-size:13px;margin-top:10px}
.alert[data-s="near"]{background:var(--warn-soft);color:var(--warn)}
.alert[data-s="over"]{background:var(--bad-soft);color:var(--bad)}
.alert span{flex:1}
.donut-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.donut{position:relative;width:var(--ds,132px);height:var(--ds,132px);flex:none}
.donut svg{width:100%;height:100%;display:block}
.donut .seg{cursor:pointer;transition:opacity .15s}
.donut-wrap.hov .seg:not(.on){opacity:.45}
.donut-c{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none;padding:0 22%}
.donut-c b{font:700 14px/1.15 var(--font-display)}
.donut-c span{font-size:11px;color:var(--ink-3)}
.legend{flex:1;min-width:130px;display:grid;gap:7px}
.leg-row{display:flex;align-items:center;gap:8px;font-size:13px}
.leg-row i{width:10px;height:10px;border-radius:3px;flex:none}
.leg-row span{flex:1;min-width:0}
.leg-row b{font-variant-numeric:tabular-nums}
.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa{display:grid;justify-items:center;gap:6px;padding:10px 2px;border-radius:14px;font-size:12px;font-weight:600;text-align:center}
.qa:hover{background:var(--surface-2)}
.qa i{width:44px;height:44px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}
.empty{padding:18px 8px;text-align:center;color:var(--ink-3)}
.empty b{display:block;color:var(--ink-2);margin-bottom:2px}

/* ---------- transactions ---------- */
.txl{display:grid;gap:2px}
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:9px 8px;border-radius:14px}
.tx:hover{background:var(--surface-2)}
.tx-m{flex:1;min-width:0;display:grid}
.tx-m b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-m small{color:var(--ink-3);font-size:12px}
.tx-a{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-a.income{color:var(--good)}
.chip{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex:none;
  background:color-mix(in srgb,var(--cc,var(--brand)) 17%,var(--surface));color:color-mix(in srgb,var(--cc,var(--brand)) 62%,var(--ink))}
.day-h{font-size:12px;font-weight:700;color:var(--ink-3);padding:12px 8px 4px;text-transform:uppercase;letter-spacing:.06em}

/* ---------- forms ---------- */
.form{display:grid;grid-template-columns:minmax(0,1fr);gap:14px;padding-top:6px}
.field{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;min-width:0}
.field>label,.field>.lab{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.in{height:48px;width:100%;min-width:0;max-width:100%;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);padding:0 14px;font:inherit;font-size:16px;color:inherit}
.in:focus-visible{outline:2px solid var(--focus);outline-offset:1px}
.rowbtn{display:flex;align-items:center;gap:10px;text-align:left}
.rowbtn .chip{width:30px;height:30px;border-radius:10px}
.rowbtn .chip .ic{width:16px;height:16px}
.rowbtn span.g{flex:1}
.money{display:flex;align-items:center;gap:8px;height:54px;padding:0 14px;border:1px solid var(--line-2);border-radius:12px;background:var(--surface)}
.money:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.money>span{font-weight:700;color:var(--ink-2)}
.money input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:700 22px var(--font-display);color:inherit}
.seg-ctl{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;padding:4px;border-radius:12px;background:var(--surface-2)}
.seg-ctl button{height:38px;border-radius:9px;font-weight:700;font-size:13px;color:var(--ink-2);text-align:center}
.seg-ctl button[aria-selected="true"],.seg-ctl button[aria-checked="true"]{background:var(--brand);color:var(--on-brand)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 18px;border-radius:14px;font-weight:700;width:100%;text-align:center}
.btn.primary{background:var(--brand);color:var(--on-brand)}
.btn.sec{background:var(--surface-2);color:var(--brand);border:1px solid var(--line-2)}
.btn.ghost{color:var(--ink-2)}
.btn.danger{color:var(--bad)}
.btn.sm{height:40px;font-size:13px;width:auto}
.btn-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.pick{display:grid;gap:4px}
.pick-i{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;width:100%}
.pick-i:hover,.pick-i[aria-pressed="true"]{background:var(--surface-2)}
.pick-i span{flex:1;font-weight:600}
.pick-i .ic{color:var(--brand)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipbtn{padding:8px 14px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line-2);font-weight:700;font-size:13px}
.iconpick{display:flex;gap:8px;flex-wrap:wrap;border:0;padding:0;margin:0}
.iconpick label{cursor:pointer}
.iconpick input{position:absolute;opacity:0;width:1px;height:1px}
.iconpick span{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2);border:2px solid transparent}
.iconpick input:checked+span{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.iconpick input:focus-visible+span{outline:2px solid var(--focus);outline-offset:2px}

/* ---------- budget ---------- */
.tot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tot .money{height:50px;flex:1}
.brow{padding:12px 0;border-bottom:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr);gap:9px}
.brow:last-child{border-bottom:0}
.brow-top{display:flex;align-items:center;gap:10px}
.brow-n{flex:1;min-width:0;display:grid}
.brow-n b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brow>.stat{font-size:12px;color:var(--ink-3)}
.meter[data-s="near"]+.stat{color:var(--warn);font-weight:600}
.meter[data-s="over"]+.stat{color:var(--bad);font-weight:600}
.lim{display:flex;align-items:center;gap:4px;width:106px;height:38px;padding:0 8px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);font-size:12px;color:var(--ink-2)}
.lim:focus-within{outline:2px solid var(--focus);outline-offset:1px}
.lim input{width:100%;min-width:0;border:0;outline:0;background:transparent;font:700 16px var(--font-body);color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.share{font-size:12px;font-weight:600;color:var(--ink-3)}
.meter{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.meter i{display:block;height:100%;width:var(--p,0%);border-radius:99px;background:var(--cc,var(--brand))}
.meter[data-s="near"] i{background:var(--warn-bar)}
.meter[data-s="over"] i{background:var(--bad-bar)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stats div{background:var(--surface-2);border-radius:12px;padding:10px}
.stats b{display:block;font:700 15px var(--font-display);font-variant-numeric:tabular-nums}
.stats small{color:var(--ink-3);font-size:11.5px}
.warnline{font-size:12.5px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.warnline button{font-weight:800;text-decoration:underline}

/* ---------- reports ---------- */
.readout{font-size:13px;color:var(--ink-2);min-height:20px;font-variant-numeric:tabular-nums}
.readout b{color:var(--ink)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.ax{font:500 10px var(--font-body);fill:var(--ink-3)}
.gl{stroke:var(--line);stroke-width:1}
.base{stroke:var(--line-2);stroke-width:1}
.bar path{fill:var(--brand);transition:opacity .15s}
.chart.hov .bar:not(.on) path{opacity:.4}
.bar:focus-visible{outline:none}
.bar:focus-visible path{stroke:var(--ink);stroke-width:1.5}
details.tbl{margin-top:8px;font-size:12.5px}
details.tbl summary{cursor:pointer;color:var(--brand);font-weight:700;padding:6px 0}
details.tbl table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
details.tbl td,details.tbl th{padding:4px 6px;border-bottom:1px solid var(--line);text-align:left}
details.tbl td:last-child,details.tbl th:last-child{text-align:right}
.insights{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.insights li{display:flex;gap:10px;align-items:flex-start}
.insights .ic{color:var(--brand);margin-top:1px}
.save-row{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;font-size:12.5px;color:var(--ink-2)}

/* ---------- goals, profile, sync ---------- */
.goal{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.goal-h{display:flex;align-items:center;gap:12px}
.goal-h .chip{width:44px;height:44px}
.goal-n{flex:1;min-width:0}
.goal-n b{display:block;font:700 16px var(--font-display)}
.goal-n small{color:var(--ink-3)}
.goal .meter{height:10px}
.goal-f{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--ink-2)}
.done{display:inline-flex;align-items:center;gap:6px;color:var(--good);font-weight:700}
.who{display:flex;align-items:center;gap:12px}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--brand);color:var(--on-brand);display:grid;place-items:center;font:700 19px var(--font-display);flex:none}
.prow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow .pm{flex:1;min-width:0;text-align:left}
.prow .pm b{display:block}
.prow .pm small{color:var(--ink-3)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);width:100%}
.set:last-child{border-bottom:0}
.set small{display:block;color:var(--ink-3);font-size:12px}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line-2);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.sw[aria-checked="true"]{background:var(--brand)}
.sw[aria-checked="true"]::after{transform:translateX(18px)}
.xl-hero{text-align:center;display:grid;justify-items:center;gap:6px;padding:20px 16px}
.xl-hero b{font:700 17px var(--font-display)}
.xl-hero p{color:var(--ink-2);font-size:13px}
.xbadge{position:relative;width:64px;height:64px}
.xbadge svg{width:64px;height:64px}
.xbadge .ok{position:absolute;right:-8px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;border:3px solid var(--surface)}
.xbadge .ok .ic{width:14px;height:14px;stroke-width:3}
.xbadge.off svg{filter:grayscale(1);opacity:.55}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line-2);border-radius:14px;cursor:pointer}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.opt input{margin-top:3px;accent-color:var(--brand);width:18px;height:18px}
.opt b{display:block}
.opt small{color:var(--ink-2);font-size:12.5px}
.opt.dis{opacity:.5;pointer-events:none}
.info{display:flex;gap:10px;font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:12px;padding:10px 12px}
.info .ic{color:var(--brand);margin-top:1px}
.spin{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- excel window ---------- */
.xl{border:1px solid var(--line-2);border-radius:14px;overflow:hidden;background:var(--surface)}
.xl-title{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--xl-bar);color:#fff;font-weight:700;font-size:13px}
.xl-title .state{margin-left:auto;font-weight:600;font-size:11.5px;opacity:.92;text-align:right}
.xl-scroll{overflow:auto;max-height:340px}
.xl-grid{border-collapse:collapse;width:100%;font-size:11.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.xl-grid th,.xl-grid td{border:1px solid var(--line);padding:4px 8px;text-align:left}
.xl-grid thead th{background:var(--surface-2);color:var(--ink-3);font-weight:600;text-align:center;position:sticky;top:0}
.xl-grid tbody th{background:var(--surface-2);color:var(--ink-3);font-weight:600;text-align:center;width:28px}
.xl-grid tr.hdr td{background:var(--brand-soft);font-weight:700;color:var(--brand-ink)}
.xl-grid td.n{text-align:right}
.xl-grid tr.flash td{animation:flash 1.8s ease-out}
@keyframes flash{from{background:color-mix(in srgb,var(--gold) 45%,transparent)}to{background:transparent}}
.xl-tabs{display:flex;gap:2px;padding:6px 8px 0;background:var(--surface-2);border-top:1px solid var(--line-2)}
.xl-tabs button{padding:10px 14px;border-radius:8px 8px 0 0;font-size:12px;font-weight:600;color:var(--ink-2)}
.xl-tabs button[aria-selected="true"]{background:var(--surface);color:var(--xl-bar);box-shadow:inset 0 -2px 0 var(--xl-bar)}
.xl-foot{padding:8px 12px;font-size:11.5px;color:var(--ink-3)}
.side h2{font:700 22px/1.15 var(--font-display)}
.side>p{color:var(--ink-2);max-width:48ch}
.side-actions{display:flex;gap:10px;flex-wrap:wrap}

.dl-only{display:none!important}
body[data-dl="1"] .dl-only{display:inline-flex!important}
.fatal{padding:24px;text-align:center;display:grid;gap:12px}
@media (max-width:699px){body{padding-block:8px}.phone{border-radius:22px}.nav button{padding:8px 0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

function load(){try{const raw=localStorage.getItem(KEY);if(!raw)return null;const o=JSON.parse(raw);if(o&&Array.isArray(o.profiles)&&o.profiles.length&&o.profiles.every(validProfile))return o}catch(e){}return null}
function freshState(){const p=seedProfile('Alex');return{activeId:p.id,profiles:[p],hideBalance:false,alerts:true}}

/* ================= data helpers ================= */
const sortedTx=l=>l.map((t,i)=>[t,i]).sort((a,b)=>b[0].date.localeCompare(a[0].date)||b[1]-a[1]).map(x=>x[0]);
function spendByCat(p,from,to){
  const o={};CATS.forEach(c=>{o[c.id]=0});
  p.txs.forEach(t=>{if(t.type==='expense'&&t.date>=from&&t.date<=to){const k=(t.cat in o)?t.cat:'other';o[k]=r2(o[k]+t.amount)}});
  return o;
}
const balanceOf=p=>r2(p.txs.reduce((s,t)=>s+(t.type==='income'?t.amount:-t.amount),p.opening||0));
function monthNet(p,ym){const a=monthRange(ym);return r2(p.txs.reduce((s,t)=>t.date>=a[0]&&t.date<=a[1]?s+(t.type==='income'?t.amount:-t.amount):s,0))}
function alertsOf(p){
  const ym=today().slice(0,7),r=monthRange(ym),by=spendByCat(p,r[0],r[1]),out=[];
  CATS.forEach(c=>{const lim=p.budget.limits[c.id]||0;if(lim>0){const ratio=by[c.id]/lim;if(ratio>=0.8)out.push({c:c,ratio:ratio,lim:lim,spent:by[c.id]})}});
  return out.sort((a,b)=>b.ratio-a.ratio);
}
function donutSegs(by){
  const list=CATS.filter(c=>c.id!=='other'&&by[c.id]>0).map(c=>({id:c.id,name:c.name,v:by[c.id],color:'var(--c-'+c.id+')'})).sort((a,b)=>b.v-a.v);
  const segs=list.slice(0,5);
  const rest=list.slice(5).reduce((s,x)=>s+x.v,0)+(by.other||0);
  if(rest>0)segs.push({id:'other',name:'Others',v:r2(rest),color:'var(--c-other)'});
  const tot=segs.reduce((s,x)=>s+x.v,0);
  segs.forEach(s=>{s.pct=tot?s.v/tot*100:0});
  return{segs:segs,tot:r2(tot)};
}
function goalTotals(p){
  const saved=p.goals.reduce((s,g)=>s+g.saved,0),target=p.goals.reduce((s,g)=>s+g.target,0);
  const ym=today().slice(0,7);
  const month=p.goals.reduce((s,g)=>s+(g.hist||[]).reduce((a,h)=>h.date.slice(0,7)===ym?a+h.amount:a,0),0);
  return{saved:r2(saved),target:r2(target),month:r2(month),pct:target?saved/target*100:0};
}

/* ================= sync model ================= */
const isLive=p=>p.sync.linked&&p.sync.mode==='auto';
const wbTx=p=>(!isLive(p)&&p.sync.snap)?p.sync.snap:p.txs;
function touch(p){
  const s=p.sync;
  if(isLive(p)){s.last=Date.now();s.snap=null;s.pending=0}else{s.pending+=1}
  persist();
}
function takeSnap(p){p.sync.snap=p.txs.map(t=>Object.assign({},t))}
function syncState(p){
  const s=p.sync;
  if(!s.linked)return 'Not connected'+(s.pending?' · '+s.pending+' change'+(s.pending>1?'s':'')+' waiting':'');
  if(s.mode==='auto')return 'Auto-sync on · updated '+ago(s.last);
  return s.pending?s.pending+' change'+(s.pending>1?'s':'')+' waiting to sync':'Up to date · synced '+ago(s.last);
}

function wbData(p,tab){

    const t=p.budget.total,sp=sum(by);
    rows.push(['Total',fmtNum(t),fmtNum(sp),t>0?Math.round(sp/t*100)+'%':'-']);
    return{head:['Category','Monthly limit (RM)','Spent (RM)','Used'],rows:rows,ids:[],num:[1,2,3]};
  }
  if(tab==='goals'){
    const rows=p.goals.map(g=>[g.name,fmtNum(g.target),fmtNum(g.saved),Math.min(100,Math.round(g.saved/g.target*100))+'%']);

function rowStat(sp,lim){
  if(lim<=0)return{st:'none',txt:money(sp)+' spent · no limit set',ratio:0};

  if(ratio>=0.8)return{st:'near',txt:money(sp)+' of '+money(lim)+' · Near limit',ratio:ratio};
  return{st:'ok',txt:money(sp)+' of '+money(lim),ratio:ratio};
}

/* ================= reports ================= */
function periodData(p,per){
  const td=today();let buckets=[],from,prevFrom,prevTo,days,label;
  if(per==='7D'||per==='30D'||per==='3M'){
    const N=per==='7D'?7:per==='30D'?30:91,size=per==='7D'?1:per==='30D'?3:7;
    from=addDays(td,-(N-1));prevTo=addDays(from,-1);prevFrom=addDays(prevTo,-(N-1));days=N;
    label=per==='7D'?'previous 7 days':per==='30D'?'previous 30 days':'previous 13 weeks';
    for(let i=0;i<N;i+=size){
      const a=addDays(from,i),b=addDays(from,Math.min(i+size-1,N-1));
      buckets.push({a:a,b:b,label:per==='7D'?DOW[dateOf(a).getDay()]:shortDate(a),tip:a===b?dowDate(a):shortDate(a)+' to '+shortDate(b)});
    }
  }else{
    const n=per==='6M'?6:12,ym0=td.slice(0,7),sYm=addMonths(ym0,-(n-1));
    from=sYm+'-01';prevTo=addDays(from,-1);prevFrom=addMonths(sYm,-n)+'-01';days=daysBetween(from,td)+1;
    label='previous '+n+' months';
    for(let i=0;i<n;i++){const ym=addMonths(sYm,i);buckets.push({a:ym+'-01',b:ym+'-'+pad(daysInMonth(ym)),label:MON[+ym.slice(5)-1],tip:MON[+ym.slice(5)-1]+' '+ym.slice(0,4)})}
  }
  const rangeSum=(a,b)=>r2(p.txs.reduce((s,t)=>t.type==='expense'&&t.date>=a&&t.date<=b?s+t.amount:s,0));
  buckets.forEach(b=>{b.v=rangeSum(b.a,b.b)});
  const total=rangeSum(from,td),prev=rangeSum(prevFrom,prevTo);
  return{buckets:buckets,from:from,days:days,total:total,prev:prev,label:label,pct:prev>0?(total-prev)/prev*100:null};
}
function niceMax(v){const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return(f<=1?1:f<=2?2:f<=5?5:10)*e}
const axFmt=v=>v>=1000?(v/1000).toFixed(v%1000?1:0)+'K':String(Math.round(v*10)/10);
function barChartHTML(b){
  const W=320,H=158,L=34,R=6,T=10,B=24,pw=W-L-R,ph=H-T-B,n=b.length;
  const max=niceMax(Math.max.apply(null,b.map(x=>x.v).concat([1]))),slot=pw/n,bw=Math.min(22,slot*0.64),y0=T+ph;
  let g='';
  [0,0.5,1].forEach(f=>{const y=y0-f*ph;g+='<line class="'+(f===0?'base':'gl')+'" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(L-6)+'" y="'+(y+3.5)+'" text-anchor="end">'+axFmt(max*f)+'</text>'});
  const every=n<=8?1:Math.ceil(n/6);
  b.forEach((x,i)=>{
    const cx=L+i*slot+slot/2,bx=cx-bw/2,h=x.v/max*ph,y=y0-h,rr=Math.min(4,bw/2,h);
    const tip=x.tip+' · '+money(x.v);
    g+='<g class="bar" tabindex="0" role="img" aria-label="'+esc(tip)+'" data-tip="'+esc(tip)+'"><rect x="'+(L+i*slot)+'" y="'+T+'" width="'+slot+'" height="'+(ph+B)+'" fill="transparent"/>';
    if(h>0.4)g+='<path d="M'+bx.toFixed(2)+','+y0+' V'+(y+rr).toFixed(2)+' Q'+bx.toFixed(2)+','+y.toFixed(2)+' '+(bx+rr).toFixed(2)+','+y.toFixed(2)+' H'+(bx+bw-rr).toFixed(2)+' Q'+(bx+bw).toFixed(2)+','+y.toFixed(2)+' '+(bx+bw).toFixed(2)+','+(y+rr).toFixed(2)+' V'+y0+' Z"/>';
    g+='</g>';
    if(i%every===0)g+='<text class="ax" x="'+cx+'" y="'+(H-6)+'" text-anchor="middle">'+esc(x.label)+'</text>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" role="group" aria-label="Spending over time">'+g+'</svg>';
}
function insightsFor(p,per,pd,by){
  const out=[],d=donutSegs(by);
  const top=CATS.map(c=>({c:c,v:by[c.id]})).sort((a,b)=>b.v-a.v)[0];
  if(top&&top.v>0)out.push(['trend',esc(top.c.name)+' is your biggest spend at '+Math.round(top.v/pd.total*100)+'% of the total.']);
  if(pd.total>0)out.push(['calendar','You spend about '+money(pd.total/pd.days)+' a day on average.']);
  const byDay={};p.txs.forEach(t=>{if(t.type==='expense'&&t.date>=pd.from&&t.date<=today())byDay[t.date]=(byDay[t.date]||0)+t.amount});
  const pk=Object.keys(byDay).sort((a,b)=>byDay[b]-byDay[a])[0];
  if(pk)out.push(['bell','Your busiest day was '+dowDate(pk)+' with '+money(byDay[pk])+'.']);
  const ym=today().slice(0,7),tot=p.budget.total;
  if(tot>0){const r=monthRange(ym),sp=sum(spendByCat(p,r[0],r[1])),dom=new Date().getDate(),dim=daysInMonth(ym);
    out.push(['wallet','This month you have used '+Math.round(sp/tot*100)+'% of your budget with '+Math.round(dom/dim*100)+'% of the month gone.'])}
  return out.slice(0,4);
}

  h+='<section class="card" style="margin-top:12px"><h2>Top Spending Categories</h2>';

  h+='</section>';

  const ins=insightsFor(p,per,pd,by);
  if(ins.length)h+='<section class="card" style="margin-top:12px"><h2>Insights</h2><ul class="insights">'+ins.map(i=>'<li>'+ic(i[0])+'<span>'+i[1]+'</span></li>').join('')+'</ul></section>';

const SCREENS={home:homeScreen,budget:budgetScreen,goals:goalsScreen,reports:reportsScreen,profile:profileScreen,add:addScreen,list:listScreen,sync:syncScreen};
function focusKey(el){
  if(!el||!el.dataset||!el.dataset.act)return null;
  return[el.dataset.act,el.dataset.id||'',el.dataset.v||''];
}
function refocus(k,root){
  if(!k)return;
  const n=$$('[data-act]',root).find(x=>x.dataset.act===k[0]&&(x.dataset.id||'')===k[1]&&(x.dataset.v||'')===k[2]);
  if(n)n.focus({preventScroll:true});
}
function render(){
  const p=P(),scr=$('#screen'),same=ui.last===ui.screen;
  const keep=same?scr.scrollTop:0,ae=document.activeElement,k=same&&scr.contains(ae)?focusKey(ae.closest('[data-act]')):null;
  scr.innerHTML=SCREENS[ui.screen](p);
  scr.scrollTop=keep;ui.last=ui.screen;
  if(k)refocus(k,scr);
  $$('#nav button').forEach(b=>{if(b.dataset.to===ui.screen)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  $('#nav').hidden=!MAIN.includes(ui.screen);
  renderLayer();renderSide();
}
function renderSide(){const s=$('#side');if(s)s.innerHTML=sideHTML(P())}
function renderLayer(){
  const L=$('#layer');
  if(!ui.sheet){L.hidden=true;L.innerHTML='';return}
  const ae=document.activeElement,k=!ui.fresh&&L.contains(ae)?focusKey(ae.closest('[data-act]')):null;
  L.innerHTML=sheetHTML();L.hidden=false;
  if(ui.fresh){ui.fresh=false;const f=$('.sheet input:not([type=radio])',L)||$('.sheet [data-primary]',L)||$('.sheet',L);if(f)f.focus({preventScroll:true})}
  else refocus(k,L);
}
function openSheet(o){ui.ret=document.activeElement;ui.sheet=o;ui.fresh=true;renderLayer()}
function closeSheet(){
  ui.sheet=null;renderLayer();
  const r=ui.ret;ui.ret=null;if(r&&r.isConnected&&r.focus)r.focus({preventScroll:true});
}
function sheetErr(msg){const e=$('#sheetErr');if(e){e.textContent=msg;e.hidden=false}}
let toastT;
function toast(msg,kind){
  const t=$('#toast');t.textContent=msg;t.dataset.k=kind||'';t.classList.add('on');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),3400);
}
function go(s){
  if(!MAIN.includes(s)&&ui.screen!==s)ui.back=ui.screen;

  if(s==='list'){ui.lq='';ui.lf='all';ui.llim=60}
  render();

function goBack(){

/* ================= excel: export and import ================= */
const hasX=()=>typeof window.XLSX!=='undefined';
function buildWorkbook(p){
  const X=window.XLSX,wb=X.utils.book_new();
  const tx=[['Date','Type','Category','Amount (RM)','Description']].concat(sortedTx(p.txs).map(t=>[t.date,t.type==='income'?'Income':'Expense',catOf(t).name,t.amount,t.desc||'']));
  const w1=X.utils.aoa_to_sheet(tx);w1['!cols']=[{wch:12},{wch:10},{wch:16},{wch:14},{wch:36}];
  const ym=today().slice(0,7),r=monthRange(ym),by=spendByCat(p,r[0],r[1]);
  const bud=[['Category','Monthly limit (RM)','Spent this month (RM)','Used']];
  CATS.forEach(c=>{const l=p.budget.limits[c.id]||0;bud.push([c.name,l,by[c.id],l>0?by[c.id]/l:0])});
  bud.push(['Total',p.budget.total,sum(by),p.budget.total>0?sum(by)/p.budget.total:0]);
  const w2=X.utils.aoa_to_sheet(bud);w2['!cols']=[{wch:16},{wch:18},{wch:22},{wch:8}];
  const gl=[['Goal','Target (RM)','Saved (RM)','Progress']];
  p.goals.forEach(g=>gl.push([g.name,g.target,g.saved,g.target>0?Math.min(1,g.saved/g.target):0]));
  const w3=X.utils.aoa_to_sheet(gl);w3['!cols']=[{wch:22},{wch:14},{wch:14},{wch:10}];
  const fmt=(ws,col,z)=>{const rg=X.utils.decode_range(ws['!ref']);for(let i=1;i<=rg.e.r;i++){const a=X.utils.encode_cell({r:i,c:col});if(ws[a]&&ws[a].t==='n')ws[a].z=z}};
  fmt(w1,3,'#,##0.00');fmt(w2,1,'#,##0.00');fmt(w2,2,'#,##0.00');fmt(w2,3,'0%');fmt(w3,1,'#,##0.00');fmt(w3,2,'#,##0.00');fmt(w3,3,'0%');
  X.utils.book_append_sheet(wb,w1,'Transactions');X.utils.book_append_sheet(wb,w2,'Budget');X.utils.book_append_sheet(wb,w3,'Goals');
  return wb;
}
async function doDownload(){
  if(!hasX()){toast('The Excel library did not load. Check your connection and reload.','bad');return}
  if(!ui.dl){toast('Saving files is not available in this view.','bad');return}
  const p=P();
  try{
    const buf=window.XLSX.write(buildWorkbook(p),{bookType:'xlsx',type:'array'});
    const nm='Ledgerly - '+p.name.replace(/[^\w\- ]+/g,'').trim()+'.xlsx';
    const res=await ui.dl.save({filename:nm,data:buf});
    toast(res&&res.status==='saved'?'Workbook saved':'Workbook ready','good');
  }catch(e){
    if(e&&e.code==='declined')return;
    toast('Could not save the file'+(e&&e.code?' ('+e.code+')':''),'bad');
  }
}
const norm=s=>String(s==null?'':s).trim().toLowerCase();
function validDate(y,m,d){
  if(m<1||m>12||d<1||d>31||y<1990||y>2100)return null;
  const dt=new Date(y,m-1,d,12);if(dt.getMonth()!==m-1)return null;
  return y+'-'+pad(m)+'-'+pad(d);
}
function parseDateCell(v){
  if(v instanceof Date&&!isNaN(v))return isoOf(new Date(v.getTime()+12*3600*1000));
  if(typeof v==='number'&&v>20000&&v<80000){const o=window.XLSX.SSF.parse_date_code(v);if(o)return validDate(o.y,o.m,o.d)}
  const s=String(v==null?'':v).trim();let m;
  if((m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/)))return validDate(+m[1],+m[2],+m[3]);
  if((m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/)))return validDate(+m[3],+m[2],+m[1]);
  return null;
}
function colOf(row,names){for(const k of Object.keys(row)){if(names.includes(norm(k)))return row[k]}return ''}
function matchCat(name,isInc,desc){
  const n=norm(name),list=isInc?INCOME:CATS,hit=list.find(c=>c.id===n||norm(c.name)===n);
  if(hit)return hit.id;
  if(!isInc)return guessCat(desc||name)||'other';
  return 'otherinc';
}
function importFile(file){
  if(!hasX()){toast('The Excel library did not load. Check your connection and reload.','bad');return}
  if(file.size>5*1024*1024){toast('That file is over 5 MB.','bad');return}
  const fr=new FileReader();
  fr.onerror=()=>toast('That file could not be opened.','bad');
  fr.onload=()=>{
    try{
      const wb=window.XLSX.read(new Uint8Array(fr.result),{type:'array',cellDates:true});
      const sn=wb.SheetNames.find(n=>/^transactions?$/i.test(n))||wb.SheetNames[0];
      const rows=window.XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:'',raw:true});
      applyImport(rows,file.name);
    }catch(e){toast('That file could not be read as a spreadsheet.','bad')}
  };
  fr.readAsArrayBuffer(file);
}
function applyImport(rows,fname){
  const p=P(),seen=new Set(p.txs.map(t=>[t.date,t.type,t.cat,t.amount.toFixed(2),(t.desc||'').toLowerCase()].join('|')));
  let added=0,dup=0,bad=0;const cap=rows.slice(0,2000);
  cap.forEach(r=>{
    const date=parseDateCell(colOf(r,['date','day','when']));
    let amt=parseFloat(String(colOf(r,['amount (rm)','amount','amt','value','rm']))
      .replace(/[^0-9.\-]/g,''));
    if(!date||!isFinite(amt)||amt===0){bad++;return}
    const ty=norm(colOf(r,['type','kind'])),inc=ty.startsWith('inc')||ty==='credit'||ty==='in';
    amt=r2(Math.abs(amt));
    const desc=String(colOf(r,['description','desc','note','notes','details','memo'])||'').trim().slice(0,80);
    const cat=matchCat(colOf(r,['category','cat']),inc,desc),type=inc?'income':'expense';
    const key=[date,type,cat,amt.toFixed(2),desc.toLowerCase()].join('|');
    if(seen.has(key)){dup++;return}
    seen.add(key);p.txs.push({id:uid(),type:type,cat:cat,amount:amt,date:date,desc:desc});added++;
  });
  if(added)touch(p);
  const lines=[[added?'check':'info','Imported '+added+' transaction'+(added===1?'':'s')+' from '+fname+'.']];
  if(dup)lines.push(['info',dup+' duplicate'+(dup===1?'':'s')+' skipped.']);
  if(bad)lines.push(['alert',bad+' row'+(bad===1?'':'s')+' skipped because the date or amount was missing.']);
  if(rows.length>2000)lines.push(['alert','Only the first 2,000 rows were read.']);
  if(!rows.length)lines.push(['alert','No rows were found. Use a sheet with columns Date, Type, Category, Amount and Description.']);
  ui.sheet=null;render();openSheet({type:'result',lines:lines});
}

function afterBudgetMsg(p,tx){
  if(!S.alerts||tx.type!=='expense')return '';
  const lim=p.budget.limits[tx.cat]||0,ym=tx.date.slice(0,7);
  if(lim<=0||ym!==today().slice(0,7))return '';
  const r=monthRange(ym),sp=spendByCat(p,r[0],r[1])[tx.cat],after=sp/lim,before=(sp-tx.amount)/lim,nm=catOf(tx).name;
  if(before<1&&after>=1)return ' Heads up: '+nm+' is over budget.';
  if(before<0.8&&after>=0.8)return ' Heads up: '+nm+' is at '+Math.round(after*100)+'% of its budget.';
  return '';
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const f=A[t.dataset.act];if(f)f(t.dataset,t,e);
});
document.addEventListener('input',e=>{
  const t=e.target,k=t.dataset&&t.dataset.in;if(!k)return;
  if(k==='amount'&&ui.draft){ui.draft.amount=t.value;const er=$('#addErr');if(er)er.hidden=true}
  else if(k==='desc'&&ui.draft){
    const d=ui.draft;d.desc=t.value;
    if(d.type==='expense'&&d.catAuto){
      const g=guessCat(t.value);
      if(g){d.cat=g;d.hint='Auto-categorised as '+catOfId('expense',g).name+'. Tap the category to change it.'}else d.hint='';
      const b=$('#catBtn');if(b)b.innerHTML=catRowHTML();const h=$('#catHint');if(h)h.textContent=d.hint;
    }
  }
  else if(k==='limit'&&ui.bd){ui.bd.limits[t.dataset.id]=parseMoney(t.value);updBd()}
  else if(k==='total'&&ui.bd){ui.bd.total=parseMoney(t.value);updBd()}
  else if(k==='q'){ui.lq=t.value;ui.llim=60;const b=$('#listBody');if(b)b.innerHTML=listBodyHTML(P())}
});
document.addEventListener('change',e=>{
  const t=e.target,k=t.dataset&&t.dataset.in;
  if(t.id==='importFile'){const f=t.files&&t.files[0];if(f)importFile(f);t.value='';return}
  if(!k)return;
  if(k==='date'&&ui.draft)ui.draft.date=t.value;
  if(k==='limit'&&ui.bd)t.value=(ui.bd.limits[t.dataset.id]||0).toFixed(2);
  if(k==='total'&&ui.bd)t.value=ui.bd.total.toFixed(2);
  if(k==='syncMode'){
    const p=P();if(!p.sync.linked)return;
    if(t.value==='manual'){takeSnap(p);p.sync.mode='manual';p.sync.pending=0;persist();render();toast('Manual sync on. Use Sync now when you are ready.')}
    else{p.sync.mode='auto';p.sync.snap=null;p.sync.last=Date.now();p.sync.pending=0;persist();render();toast('Auto sync on. Excel is up to date.','good')}
  }
});

    if(e.target.closest('.sheet')){const b=$('.sheet [data-primary]');if(b){e.preventDefault();b.click()}}
    else if(e.target.closest('#addForm')){e.preventDefault();A.saveTx()}

function tipOn(el){
  const dw=el.closest('.donut-wrap');
  if(dw&&(el.classList.contains('seg')||el.classList.contains('leg-row'))){
    const c=$('.donut-c',dw);$('[data-d=main]',c).textContent=el.dataset.val;$('[data-d=sub]',c).textContent=el.dataset.name+' · '+el.dataset.pct;
    dw.classList.add('hov');$$('.seg',dw).forEach(s=>s.classList.toggle('on',s.dataset.name===el.dataset.name));return;
  }
  const ch=el.closest('.chart');
  if(ch&&el.classList.contains('bar')){
    const ro=$('.readout',ch);ro.innerHTML='';const b=document.createElement('b');b.textContent=el.dataset.tip;ro.appendChild(b);
    ch.classList.add('hov');$$('.bar',ch).forEach(s=>s.classList.toggle('on',s===el));
  }
}
function tipOff(el){
  const dw=el.closest('.donut-wrap');
  if(dw&&(el.classList.contains('seg')||el.classList.contains('leg-row'))){
    const c=$('.donut-c',dw);$('[data-d=main]',c).textContent=c.dataset.main;$('[data-d=sub]',c).textContent=c.dataset.sub;
    dw.classList.remove('hov');$$('.seg',dw).forEach(s=>s.classList.remove('on'));return;
  }
  const ch=el.closest('.chart');
  if(ch&&el.classList.contains('bar')){
    const ro=$('.readout',ch);ro.innerHTML=ro.dataset.def;ch.classList.remove('hov');$$('.bar',ch).forEach(s=>s.classList.remove('on'));
  }
}
const TIPSEL='.seg,.leg-row,.bar';
document.addEventListener('pointerover',e=>{const el=e.target.closest&&e.target.closest(TIPSEL);if(el)tipOn(el)});
document.addEventListener('pointerout',e=>{if(e.pointerType==='touch')return;const el=e.target.closest&&e.target.closest(TIPSEL);if(el&&!el.contains(e.relatedTarget))tipOff(el)});
document.addEventListener('focusin',e=>{
  const el=e.target.closest&&e.target.closest(TIPSEL);if(el)tipOn(el);
  const t=e.target;
  if(t&&(t.tagName==='INPUT'&&t.type!=='radio')&&t.closest('.screen,.sheet')){setTimeout(()=>{try{if(document.activeElement===t)t.scrollIntoView({block:'center',behavior:'smooth'})}catch(x){}},320)}
});
document.addEventListener('focusout',e=>{const el=e.target.closest&&e.target.closest(TIPSEL);if(el)tipOff(el)});

/* ================= boot ================= */
function buildStatic(){
  $('#brand').innerHTML=brandHTML();
  const items=[['home','Home','home'],['budget','Budget','wallet'],['goals','Goals','target'],['reports','Reports','chart'],['profile','Profile','user']];
  $('#nav').innerHTML=items.map(i=>'<button data-act="tab" data-to="'+i[0]+'">'+ic(i[2])+'<span>'+i[1]+'</span></button>').join('');
}
function tickClock(){const d=new Date(),h=d.getHours()%12||12;const c=$('#clock');if(c)c.textContent=h+':'+pad(d.getMinutes())}
function boot(){
  try{buildStatic();render();tickClock();setInterval(tickClock,30000)}
  catch(err){
    console.error(err);
    $('#screen').innerHTML='<div class="fatal"><b>Ledgerly could not open your saved data.</b><p class="hint">Clearing it starts fresh with the example data.</p><button class="btn primary" id="resetAll">Clear saved data</button></div>';
    const b=$('#resetAll');if(b)b.onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}location.reload()};
  }
  try{
    if(window.claude&&typeof window.claude.use==='function'){
      window.claude.use('downloads').then(m=>{ui.dl=m||null;document.body.dataset.dl=m?'1':''}).catch(()=>{});
    }
  }catch(e){}
}
boot();
})();
</script>
